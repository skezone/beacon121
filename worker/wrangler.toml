# ============================================================
# beacon121 - Worker Configuration
# ============================================================

name = "beacon121-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------
# Environment: production
# ------------------------------------------------------------
[env.production]

# ------------------------------------------------------------
# D1 Database binding
# The Worker accesses D1 via:  env.DB
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "beacon121-db"
database_id = "9b2d4538-ef6a-428b-bc7c-ddfc45e91290"

# ------------------------------------------------------------
# Observability (free tier logs)
# ------------------------------------------------------------
[observability]
enabled = true
